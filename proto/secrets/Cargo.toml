[package]
name = "seuoffice-secrets-proof"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway proof: open Electron safeStorage blobs from Rust (decision 0026)"

# Stand-alone: never part of another Cargo workspace.
[workspace]

[lib]
name = "seuoffice_secrets"
path = "src/lib.rs"

[[bin]]
name = "open-sealed"
path = "src/bin/open-sealed.rs"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde_json = "1"
sha1 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = "s"
