[package]
name = "seuoffice-proto-tauri2"
version = "0.13.0"
description = "Throwaway Tauri 2 shell prototype (proto/README.md)"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "SeuOffice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry", "NSDictionary", "NSObject", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSWindow", "NSView", "NSResponder", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
