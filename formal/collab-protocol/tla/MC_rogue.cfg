\* The fixed design against an engine that replays a submit whose seq the log already holds, with
\* the current head as base (a buggy engine, or a replayed frame). The server must keep design
\* invariant 2 whatever a client sends; every other safety property is checked too.
CONSTANTS
    Clients = {c1, c2}
    OpsPer = 2
    MaxCuts = 1
    SupersedeOnHello = TRUE
    AttemptFence = TRUE
    DoomedOnReconnect = "drop"
    RogueClients <- RogueOn
SPECIFICATION Spec
INVARIANTS
    TypeOK
    P1_NoOpTwice
    P2_ConfirmedIsLogPrefix
    P3_ConfirmedOpsInLog
    P4_QuietIsDone
    ServerInv1_BaseIsHead
    ServerInv2_ClientSeqOnce
PROPERTIES
    P5_InflightChangesOnlyAfterProof
