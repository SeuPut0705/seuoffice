\* Old sockets are never closed by a newer hello (a second server process sharing the store, or a
\* close the server has not noticed): late frames of dead connections reach store.append.
CONSTANTS
    Clients = {c1, c2}
    OpsPer = 2
    MaxCuts = 2
    SupersedeOnHello = FALSE
    AttemptFence = FALSE
    DoomedOnReconnect = "drop"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    P1_NoOpTwice
    P2_ConfirmedIsLogPrefix
    P3_ConfirmedOpsInLog
    P4_QuietIsDone
    FramesCovered
    StaleAfterCatchUp
    InflightAtConfirmed
    NoStaleForLiveInflight
    AcksCovered
    HelloAnsweredFirst
    ServerInv1_BaseIsHead
    ServerInv2_ClientSeqOnce
PROPERTIES
    P5_InflightChangesOnlyAfterProof
    P4_NoOpLost
