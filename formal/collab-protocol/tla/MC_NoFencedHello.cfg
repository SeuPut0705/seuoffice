\* Sanity: must FAIL on SanityNoFencedHello (a hello of a given-up connection arrives after a
\* newer attempt was welcomed, so the attempt fence really decides something).
CONSTANTS
    Clients = {c1, c2}
    OpsPer = 1
    MaxCuts = 2
    SupersedeOnHello = TRUE
    AttemptFence = TRUE
    DoomedOnReconnect = "drop"
SPECIFICATION Spec
INVARIANT SanityNoFencedHello
