\* Finding F1: the design as written for hello (no fence). A late hello from a dead connection
\* supersedes the live socket; the client fails with its edits unconfirmed. Must FAIL on P4.
CONSTANTS
    Clients = {c1, c2}
    OpsPer = 1
    MaxCuts = 2
    SupersedeOnHello = TRUE
    AttemptFence = FALSE
    DoomedOnReconnect = "drop"
SPECIFICATION Spec
INVARIANTS
    P1_NoOpTwice
    P2_ConfirmedIsLogPrefix
    P4_QuietIsDone
