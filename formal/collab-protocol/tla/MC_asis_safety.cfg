\* The design exactly as written (no attempt fence, a doomed in-flight is kept on reconnect):
\* every safety property must still hold. P4 is left out here; MC_F1 and MC_F2 check it.
CONSTANTS
    Clients = {c1, c2}
    OpsPer = 2
    MaxCuts = 2
    SupersedeOnHello = TRUE
    AttemptFence = FALSE
    DoomedOnReconnect = "keep"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    P1_NoOpTwice
    P2_ConfirmedIsLogPrefix
    P3_ConfirmedOpsInLog
    FramesCovered
    StaleAfterCatchUp
    InflightAtConfirmed
    NoStaleForLiveInflight
    AcksCovered
    HelloAnsweredFirst
    ServerInv1_BaseIsHead
    ServerInv2_ClientSeqOnce
PROPERTIES
    P5_InflightChangesOnlyAfterProof
