\* Sanity: must FAIL on SanityNoLateCopy. With old sockets left open, a copy of a submit still waits
\* on a dead connection after the client already holds that seq confirmed (it then reaches store.append).
CONSTANTS
    Clients = {c1, c2}
    OpsPer = 2
    MaxCuts = 2
    SupersedeOnHello = FALSE
    AttemptFence = FALSE
    DoomedOnReconnect = "drop"
SPECIFICATION Spec
INVARIANT SanityNoLateCopy
