CONSTANTS
    Clients = {c1, c2, c3}
    OpsPer = 1
    MaxCuts = 2
    SupersedeOnHello = TRUE
    AttemptFence = TRUE
    DoomedOnReconnect = "drop"
SPECIFICATION Spec
SYMMETRY Perms
INVARIANTS
    TypeOK
    P1_NoOpTwice
    P2_ConfirmedIsLogPrefix
    P3_ConfirmedOpsInLog
    P4_QuietIsDone
    FramesCovered
    StaleAfterCatchUp
    InflightAtConfirmed
    NoStaleForLiveInflight
    AcksCovered
    HelloAnsweredFirst
    ServerInv1_BaseIsHead
    ServerInv2_ClientSeqOnce
PROPERTIES
    P5_InflightChangesOnlyAfterProof
