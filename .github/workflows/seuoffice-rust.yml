name: seuoffice rust

# The Rust document engines (crates/) and their parity gates against the
# TypeScript engines (tools/docx-diff, tools/pptx-diff, tools/odt-diff), on a GitHub runner.
# Decision 0025.
#
# It runs on its own for a push to main that touches the crates or the gates,
# and by hand on a branch:
#   gh workflow run "seuoffice rust" --ref <branch>
# The workstation that develops the port is shared and slow, which is why the
# full gate runs here.
#
# The `quick` job runs first and every other job needs it: a tree that fails
# rustfmt, clippy, the unit tests or the gate harness's own tests takes one
# runner for minutes instead of the gate's and the faults' runners for an hour.
# A job added here (a gate, a fault matrix) takes `needs: quick` as well.

on:
  push:
    branches: [main]
    paths:
      [
        'crates/**',
        'tools/docx-diff/**',
        'tools/pptx-diff/**',
        'tools/odt-diff/**',
        'packages/docx-engine/src/**',
        'packages/pptx-engine/src/**',
        'packages/odt-engine/src/**',
      ]
  workflow_dispatch:
    inputs:
      main_faults:
        description: A faults file for tools/main-diff/faults.mjs (the central process), run beside the gates
        required: false
        default: ''
      main_faults_product_sha:
        description: Exact product commit for the isolated central process fault run
        required: false
        type: string
        default: ''
      main_faults_gate_run:
        description: Successful baseline workflow run ID for the product commit
        required: false
        type: string
        default: ''
      main_baseline_product_sha:
        description: Exact product commit for Linux full central comparison and Windows baseline only
        required: false
        type: string
        default: ''
      faults:
        description: A faults file for tools/docx-diff/faults.py, run instead of the gate (on a rust-faults/* branch)
        required: false
        default: ''
      odt_faults:
        description: Odt fault ids, comma-separated, probed alone (the other jobs are skipped)
        required: false
        default: ''
      # 1 while the organisation has few runners; more shards end a long faults
      # file sooner but hold that many runners at once
      fault_shards:
        description: Runners the faults file is split over (FAULT_SHARD of faults.py)
        type: choice
        options: ['1', '2', '4', '8']
        default: '1'
      # a branch run skips the fault probes of an engine nothing it changed can
      # reach (tools/fault-reach.mjs); main always runs them all
      all_faults:
        description: Run every engine's fault probes, as before a merge
        type: boolean
        default: false

concurrency:
  group: seuoffice-rust-${{ github.ref }}
  cancel-in-progress: ${{ inputs.main_faults_product_sha == '' && inputs.main_faults_gate_run == '' && inputs.main_baseline_product_sha == '' }}

permissions:
  contents: read
  actions: read

jobs:
  quick:
    if: ${{ !inputs.main_faults_product_sha && !inputs.main_faults_gate_run && !inputs.main_baseline_product_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      docx_files: ${{ steps.reach.outputs.docx_files }}
      pptx_faults: ${{ steps.reach.outputs.pptx }}
      odt_faults: ${{ steps.reach.outputs.odt }}
    steps:
      # the gate harness's typecheck reads the declarations at MODEL_SOURCE's commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - name: Format
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      # every check below runs whether or not an earlier one failed, so that one
      # run says everything: the job is red when any of them is
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/Cargo.toml --workspace

      # the vendored regex engine carries patches of its own: its suite runs as published
      - name: Vendored regress tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/vendor/regress/Cargo.toml --features utf16

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Gate harness typecheck and tests
        if: ${{ !cancelled() }}
        run: |
          npm --prefix tools/docx-diff run typecheck
          npm --prefix tools/docx-diff run test

      # the unused import that failed ci.yml's Lint for tools/pptx-diff stops here too
      - name: Gate harness lint
        if: ${{ !cancelled() }}
        run: npx eslint tools/docx-diff tools/pptx-diff tools/odt-diff

      - name: Fault planning regressions
        if: ${{ !cancelled() }}
        run: |
          node --test tools/fault-planning.test.mjs
          python3 -m unittest discover -s tools/docx-diff -p test_faults.py

      - name: Fault probes this run reaches
        id: reach
        if: ${{ !cancelled() }}
        env:
          ALL_FAULTS: ${{ inputs.all_faults }}
          DOCX_FAULTS: ${{ inputs.faults }}
          ODT_FAULTS: ${{ inputs.odt_faults }}
        run: |
          MODE="$(node tools/fault-reach.mjs --mode)"
          if [ "$MODE" = all ]; then
            node tools/fault-reach.mjs --all --github-output
          else
            node tools/fault-reach.mjs "$(git merge-base origin/main HEAD)" --github-output
          fi

  crates:
    needs: quick
    if: ${{ !inputs.faults && !inputs.odt_faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain with the WASI target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      # every check below runs whether or not an earlier one failed, so that one
      # run says everything: the job is red when any of them is
      - name: Licences of the dependencies
        run: |
          cargo install cargo-deny --locked
          cd crates && cargo deny check licenses

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: npm

      # a search past the backtrack bound refuses on wasm32 too, where an
      # unbounded stack traps the module
      - name: Regex bound on wasm32
        if: ${{ !cancelled() }}
        run: |
          cargo build --manifest-path crates/Cargo.toml -p jscompat --example limit_wasm --target wasm32-wasip1 --release
          node --no-warnings crates/jscompat/examples/limit_wasm.mjs crates/target/wasm32-wasip1/release/examples/limit_wasm.wasm 25000000

      - name: Install
        if: ${{ !cancelled() }}
        run: npm ci

      # the whole output is kept as an artifact: the first comparison of a newly
      # ported group is read from there, not from a run on somebody's machine
      - name: Parity gate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p tools/docx-diff/out
          npm --prefix tools/docx-diff run gate -- --by-function --show 20 2>&1 | tee tools/docx-diff/out/gate.txt

      - name: Keep the gate output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docx-diff-out
          path: tools/docx-diff/out
          if-no-files-found: ignore

      # the central process (decision 0030): crates/main-core through its
      # Node-API addon against the TypeScript main process
      - name: Central process comparison
        if: ${{ !cancelled() }}
        # a full run takes minutes; a case that never returns fails the step
        # (its log and trace are kept) instead of holding the job for hours
        timeout-minutes: 30
        shell: bash
        env:
          MAIN_DIFF_TRACE: ${{ github.workspace }}/tools/main-diff/out/trace.txt
        run: |
          npm --prefix tools/main-diff run typecheck
          mkdir -p tools/main-diff/out
          npm --prefix tools/main-diff run gate -- --show 40 2>&1 | tee tools/main-diff/out/gate.txt

      - name: Keep the central process comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-diff-out
          path: tools/main-diff/out
          if-no-files-found: ignore

  # Fault injection: each fault of the file through comparison (f), one at a
  # time. It rebuilds the wasm once per fault, which is why it runs here.
  faults:
    needs: quick
    if: ${{ !inputs.odt_faults && needs.quick.outputs.docx_files != '' && needs.quick.outputs.docx_files != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        catalog: ${{ fromJSON(needs.quick.outputs.docx_files) }}
        # the shard indices of the fault_shards choice; a matrix cannot count to n itself
        shard: ${{ fromJSON('{"1":[0],"2":[0,1],"4":[0,1,2,3],"8":[0,1,2,3,4,5,6,7]}')[inputs.fault_shards || '1'] }}
    steps:
      # the model group reads the declarations at MODEL_SOURCE's commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain with the WASI target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-faults-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Faults
        env:
          FAULTS: ${{ matrix.catalog }}
          FAULT_SHARD: ${{ matrix.shard }}/${{ inputs.fault_shards || '1' }}
        run: python3 tools/docx-diff/faults.py "$FAULTS"

      - name: Keep the result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          # a targeted single-catalog, single-shard run keeps its historical artifact name
          name: ${{ inputs.faults && (inputs.fault_shards == '1' || !inputs.fault_shards) && 'docx-diff-faults' || format('docx-diff-faults-{0}', strategy.job-index) }}
          path: tools/docx-diff/out
          if-no-files-found: ignore

  pptx:
    needs: quick
    if: ${{ !inputs.faults && !inputs.odt_faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Is the slides gate in this tree
        id: has
        run: |
          if [ -f tools/pptx-diff/package.json ]; then echo "pptx=true" >> "$GITHUB_OUTPUT"; else echo "pptx=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.pptx == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        if: steps.has.outputs.pptx == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-pptx-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        if: steps.has.outputs.pptx == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.has.outputs.pptx == 'true'
        run: npm ci

      - name: Slides gate typecheck
        if: steps.has.outputs.pptx == 'true'
        run: npm --prefix tools/pptx-diff run typecheck

      - name: Slides parity gate
        if: steps.has.outputs.pptx == 'true'
        run: npm --prefix tools/pptx-diff run gate

      - name: Slides fault anchors
        if: steps.has.outputs.pptx == 'true'
        run: npm --prefix tools/pptx-diff run faults -- --inventory

      - name: Keep the slides gate output
        if: always() && steps.has.outputs.pptx == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pptx-diff-out
          path: tools/pptx-diff/out
          if-no-files-found: ignore

  # One Rust fault at a time through the slides gate: each must be caught.
  pptx-faults:
    needs: quick
    if: ${{ !inputs.faults && !inputs.odt_faults && needs.quick.outputs.pptx_faults == 'true' }}
    runs-on: ubuntu-latest
    # a shard runs 40 probes of about two minutes each; a slow runner needs past 90
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Is the slides gate in this tree
        id: has
        run: |
          if [ -f tools/pptx-diff/package.json ]; then echo "pptx=true" >> "$GITHUB_OUTPUT"; else echo "pptx=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.pptx == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        if: steps.has.outputs.pptx == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: seuoffice-rust-pptx-faults-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        if: steps.has.outputs.pptx == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.has.outputs.pptx == 'true'
        run: npm ci

      - name: Slides fault probes
        if: steps.has.outputs.pptx == 'true'
        run: npm --prefix tools/pptx-diff run faults -- --shard ${{ matrix.shard }}/8

      - name: Keep the fault probe output
        if: always() && steps.has.outputs.pptx == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pptx-faults-out-${{ matrix.shard }}
          path: tools/pptx-diff/out/faults
          if-no-files-found: ignore

  odt:
    needs: quick
    if: ${{ !inputs.faults && !inputs.odt_faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Is the odt gate in this tree
        id: has
        run: |
          if [ -f tools/odt-diff/package.json ]; then echo "odt=true" >> "$GITHUB_OUTPUT"; else echo "odt=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.odt == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        if: steps.has.outputs.odt == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-odt-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        if: steps.has.outputs.odt == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.has.outputs.odt == 'true'
        run: npm ci

      - name: Odt gate typecheck
        if: steps.has.outputs.odt == 'true'
        run: npm --prefix tools/odt-diff run typecheck

      - name: Odt parity gate
        if: ${{ !cancelled() && steps.has.outputs.odt == 'true' }}
        shell: bash
        run: |
          mkdir -p tools/odt-diff/out
          npm --prefix tools/odt-diff run gate 2>&1 | tee tools/odt-diff/out/gate.txt

      - name: Keep the odt gate output
        if: always() && steps.has.outputs.odt == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odt-diff-out
          path: tools/odt-diff/out
          if-no-files-found: ignore

  # One Rust fault at a time through the odt gate: each must be caught.
  odt-faults:
    needs: [quick, odt]
    # odt_faults names faults to probe: they run whatever the branch changed
    if: ${{ !cancelled() && !inputs.faults && needs.quick.result == 'success' && (inputs.odt_faults || (needs.odt.result == 'success' && needs.quick.outputs.odt_faults == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # eight runners: with the probe-dev build (tools/odt-diff/faults.mjs) a
        # wire-command fault takes minutes, and 26 runners, one fault each,
        # spent more on setup and the baseline build than on faults
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Is the odt gate in this tree
        id: has
        run: |
          if [ -f tools/odt-diff/package.json ]; then echo "odt=true" >> "$GITHUB_OUTPUT"; else echo "odt=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.odt == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        if: steps.has.outputs.odt == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: seuoffice-rust-odt-faults-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        if: steps.has.outputs.odt == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.has.outputs.odt == 'true'
        run: npm ci

      - name: Odt fault probes
        if: steps.has.outputs.odt == 'true'
        env:
          ONLY: ${{ inputs.odt_faults }}
        # the positive control proves the harness once per run, on shard 0
        run: npm --prefix tools/odt-diff run faults -- ${ONLY:+--only "$ONLY"} --shard ${{ matrix.shard }}/8 ${{ matrix.shard != 0 && '--no-control' || '' }}

      - name: Keep the fault probe output
        if: always() && steps.has.outputs.odt == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odt-faults-out-${{ matrix.shard }}
          path: tools/odt-diff/out/faults
          if-no-files-found: ignore

  # The central process on Windows (decision 0030): the functions whose Rust
  # reads the platform (the file identity of fs.statSync, the file error
  # table of node-fs) against the TypeScript on the same machine. The Linux job compares everything else.
  main-windows:
    needs: quick
    if: ${{ !inputs.faults }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Is the central process in this tree
        id: has
        shell: bash
        run: |
          if [ -f crates/main-core/Cargo.toml ]; then echo "main=true" >> "$GITHUB_OUTPUT"; else echo "main=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust toolchain
        if: steps.has.outputs.main == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # node_fs's Windows error table against libuv's own switch, every case
      - name: Error table against libuv
        if: steps.has.outputs.main == 'true'
        working-directory: crates
        run: cargo test -p main-core --lib libuv_table

      - uses: actions/setup-node@v4
        if: steps.has.outputs.main == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.has.outputs.main == 'true'
        run: npm ci

      - name: Central process comparison on Windows
        if: steps.has.outputs.main == 'true'
        shell: bash
        run: |
          mkdir -p tools/main-diff/out
          # two runs, each its own filter; the second must not hide the first's failure
          set +e
          status=0
          npm --prefix tools/main-diff run gate -- --fn rename-validation.isSameFile --fn rename-validation.pdfSaveAsTarget --fn folder-files.plainFileIn.hardLinks --fn write-guard.appendData.hardLinks --show 40 2>&1 | tee tools/main-diff/out/gate.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          npm --prefix tools/main-diff run gate -- --group node-fs --show 40 2>&1 | tee tools/main-diff/out/gate-node-fs.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          exit $status

      - name: Keep the Windows comparison
        if: ${{ always() && steps.has.outputs.main == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: main-diff-windows-out
          path: tools/main-diff/out
          if-no-files-found: ignore

  # Fault injection for the central process (decision 0030): each fault of
  # the file rebuilds the Node-API addon and runs the comparison of its
  # functions, which must then differ.
  main-faults:
    needs: quick
    if: ${{ inputs.main_faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON('{"1":[0],"2":[0,1],"4":[0,1,2,3],"8":[0,1,2,3,4,5,6,7]}')[inputs.fault_shards || '1'] }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Faults
        shell: bash
        env:
          FAULTS: ${{ inputs.main_faults }}
          FAULT_SHARD: ${{ matrix.shard }}/${{ inputs.fault_shards || '1' }}
        run: |
          mkdir -p tools/main-diff/out
          node tools/main-diff/faults.mjs "$FAULTS" 2>&1 | tee tools/main-diff/out/faults.txt

      - name: Keep the result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-diff-faults-${{ matrix.shard }}
          path: tools/main-diff/out
          if-no-files-found: ignore

  main-faults-only-prepare:
    if: ${{ (inputs.main_faults_product_sha || inputs.main_faults_gate_run) && !inputs.main_baseline_product_sha }}
    runs-on: ubuntu-latest
    outputs:
      catalogs: ${{ steps.plan.outputs.catalogs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          sparse-checkout: tools/main-diff/faults-only.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_faults_product_sha }}
          path: product
          sparse-checkout: tools/main-diff/faults
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Plan isolated faults
        id: plan
        env:
          PRODUCT_DIR: product
          DRIVER_DIR: driver
          PLAN_PATH: plan.json
          PRODUCT_SHA: ${{ inputs.main_faults_product_sha }}
          DEFINITION_SHA: ${{ github.sha }}
          GATE_RUN_ID: ${{ inputs.main_faults_gate_run }}
          FAULT_SHARDS: ${{ inputs.fault_shards }}
          DOCX_FAULTS: ${{ inputs.faults }}
          ODT_FAULTS: ${{ inputs.odt_faults }}
          MAIN_FAULTS: ${{ inputs.main_faults }}
          ALL_FAULTS: ${{ inputs.all_faults }}
          GH_TOKEN: ${{ github.token }}
        run: node driver/tools/main-diff/faults-only.mjs plan

      - uses: actions/upload-artifact@v4
        with:
          name: main-faults-only-plan
          path: plan.json
          if-no-files-found: error

  main-faults-only:
    needs: main-faults-only-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        catalog: ${{ fromJSON(needs.main-faults-only-prepare.outputs.catalogs) }}
        shard: [0, 1, 2, 3]
    env:
      PRODUCT_DIR: product
      DRIVER_DIR: driver
      PLAN_PATH: plan/plan.json
      CATALOG: ${{ matrix.catalog.path }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          sparse-checkout: tools/main-diff/faults-only.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_faults_product_sha }}
          path: product
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: main-faults-only-plan
          path: plan

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check plan identities
        run: node driver/tools/main-diff/faults-only.mjs check

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install
        working-directory: product
        run: npm ci

      - name: Faults
        working-directory: product
        shell: bash
        env:
          FAULT_SHARD: ${{ matrix.shard }}/4
        run: |
          mkdir -p tools/main-diff/out
          node tools/main-diff/faults.mjs "$CATALOG" 2>&1 | tee tools/main-diff/out/faults.txt

      - name: Audit fault results
        if: ${{ !cancelled() }}
        run: node driver/tools/main-diff/faults-only.mjs audit

      - name: Keep the result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-faults-only-${{ matrix.catalog.label }}-${{ matrix.shard }}
          path: product/tools/main-diff/out
          if-no-files-found: ignore

  # Explicit baseline evidence is not a green product-head gate for faults-only.
  main-baseline-only:
    if: ${{ inputs.main_baseline_product_sha != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            profile: linux
          - os: windows-latest
            profile: windows
    env:
      PRODUCT_DIR: ${{ github.workspace }}/product
      DRIVER_DIR: ${{ github.workspace }}/driver
      PLAN_PATH: ${{ github.workspace }}/baseline-plan.json
      PRODUCT_SHA: ${{ inputs.main_baseline_product_sha }}
      DEFINITION_SHA: ${{ github.sha }}
      PROFILE: ${{ matrix.profile }}
      DOCX_FAULTS: ${{ inputs.faults }}
      ODT_FAULTS: ${{ inputs.odt_faults }}
      MAIN_FAULTS: ${{ inputs.main_faults }}
      FAULT_PRODUCT_SHA: ${{ inputs.main_faults_product_sha }}
      GATE_RUN_ID: ${{ inputs.main_faults_gate_run }}
      ALL_FAULTS: ${{ inputs.all_faults }}
      FAULT_SHARDS: ${{ inputs.fault_shards }}
      SEUOFFICE_WASM: ${{ github.workspace }}/product/crates/target/wasm32-wasip1/release/office_wasm.wasm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          sparse-checkout: tools/main-diff/baseline-only.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate explicit baseline mode
        id: plan
        run: node driver/tools/main-diff/baseline-only.mjs prepare

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.product_sha }}
          path: product
          persist-credentials: false

      - name: Verify both immutable checkouts
        run: node driver/tools/main-diff/baseline-only.mjs check

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/crates

      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: product/crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('product/vendor/rhwp-core/**', 'product/tools/build-rhwp-core.mjs') }}

      - name: Product rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        working-directory: product
        run: node tools/build-rhwp-core.mjs --source-only

      - name: Install product dependencies
        working-directory: product
        run: npm ci

      - name: Build exact product WASM
        working-directory: product
        run: npm run build:wasm

      - name: Typecheck central comparison
        working-directory: product
        run: npm --prefix tools/main-diff run typecheck

      - name: Inventory every selected product case
        shell: bash
        run: node product/node_modules/tsx/dist/cli.mjs driver/tools/main-diff/baseline-only.mjs inventory

      - name: Full central process comparison
        if: matrix.profile == 'linux'
        working-directory: product
        shell: bash
        env:
          MAIN_DIFF_OUT: ${{ github.workspace }}/product/tools/main-diff/out/linux
          MAIN_DIFF_TRACE: ${{ github.workspace }}/product/tools/main-diff/out/linux/trace.txt
        run: |
          mkdir -p tools/main-diff/out/linux
          npm --prefix tools/main-diff run gate -- --show 40 2>&1 | tee tools/main-diff/out/linux/gate.txt

      - name: Windows error table against libuv
        if: matrix.profile == 'windows'
        working-directory: product/crates
        run: cargo test -p main-core --lib libuv_table

      - name: Windows central process comparison
        if: matrix.profile == 'windows'
        working-directory: product
        shell: bash
        run: |
          set +e
          status=0
          mkdir -p tools/main-diff/out/windows-filtered tools/main-diff/out/windows-node-fs
          MAIN_DIFF_OUT="$PRODUCT_DIR/tools/main-diff/out/windows-filtered" npm --prefix tools/main-diff run gate -- --fn rename-validation.isSameFile --fn rename-validation.pdfSaveAsTarget --fn folder-files.plainFileIn.hardLinks --fn write-guard.appendData.hardLinks --show 40 2>&1 | tee tools/main-diff/out/windows-filtered/gate.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          MAIN_DIFF_OUT="$PRODUCT_DIR/tools/main-diff/out/windows-node-fs" npm --prefix tools/main-diff run gate -- --group node-fs --show 40 2>&1 | tee tools/main-diff/out/windows-node-fs/gate.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          exit $status

      - name: Audit function and case completeness
        run: node driver/tools/main-diff/baseline-only.mjs audit

      - name: Keep baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-baseline-only-${{ matrix.profile }}
          path: |
            baseline-plan.json
            product/tools/main-diff/out
          if-no-files-found: error
