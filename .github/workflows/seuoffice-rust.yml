name: seuoffice rust

# The Rust document engines (crates/) and their parity gates against the
# TypeScript engines (tools/docx-diff, tools/pptx-diff, tools/fileparse-diff,
# tools/epub-diff), on a GitHub runner. Decision 0025.
#
# crates/ lives on a branch until its first unit is merged, so this file does
# nothing on main yet: start it on that branch by hand,
#   gh workflow run "seuoffice rust" --ref <branch>
# It runs on its own for a push that touches the crates or the gate once they
# are on main. The workstation that develops the port is shared and slow, which
# is why the full gate runs here.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'tools/docx-diff/**'
      - 'tools/fileparse-diff/**'
      - 'tools/epub-diff/**'
      - 'tools/pptx-diff/**'
      - 'packages/docx-engine/src/**'
      - 'packages/file-parse/**'
      - 'packages/epub-engine/src/**'
      - 'packages/agent-core/src/redact-*.ts'
      - 'packages/zip-gate/src/**'
      - 'packages/drawio-model/src/**'
      - 'packages/pptx-engine/src/**'
      - 'package-lock.json'
      - '.github/workflows/seuoffice-rust.yml'
      - '**/*.docx'
      - '**/*.pptx'
      - '**/*.xlsx'
      - '**/*.xlsm'
      - '**/*.epub'
      - '**/*.hwpx'
      - '**/*.odt'
      - '**/*.xmind'
      - '**/*.doc'
      - '**/*.ppt'
  workflow_dispatch:
    inputs:
      faults:
        description: A faults file for tools/docx-diff/faults.py, run instead of the gate (on a rust-faults/* branch)
        required: false
        default: ''

concurrency:
  group: seuoffice-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crates:
    if: ${{ !inputs.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only

      - name: Is the Rust engine in this tree
        id: has
        run: |
          if [ -f crates/Cargo.toml ]; then echo "crates=true" >> "$GITHUB_OUTPUT"; else echo "crates=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.crates == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-wasip1
          rustc --version

      - uses: actions/cache@v4
        if: steps.has.outputs.crates == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - name: Format
        if: steps.has.outputs.crates == 'true'
        # the workspace's members only: --all would walk the rhwp source too
        run: cargo fmt --manifest-path crates/Cargo.toml -- --check

      # every check below runs whether or not an earlier one failed, so that one
      # run says everything: the job is red when any of them is
      - name: Clippy
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        run: cargo test --manifest-path crates/Cargo.toml --workspace

      - name: Licences of the dependencies
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        run: |
          cargo install cargo-deny --locked
          cd crates && cargo deny check licenses

      # the vendored regex engine carries patches of its own: its suite runs as published
      - name: Vendored regress tests
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        run: cargo test --manifest-path crates/vendor/regress/Cargo.toml --features utf16

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        with:
          node-version: 22
          cache: npm

      # a search past the backtrack bound refuses on wasm32 too, where an
      # unbounded stack traps the module
      - name: Regex bound on wasm32
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        run: |
          cargo build --manifest-path crates/Cargo.toml -p jscompat --example limit_wasm --target wasm32-wasip1 --release
          node --no-warnings crates/jscompat/examples/limit_wasm.mjs crates/target/wasm32-wasip1/release/examples/limit_wasm.wasm 25000000

      - name: Install
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        run: npm ci

      - name: Gate harness typecheck and tests
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        run: |
          npm --prefix tools/docx-diff run typecheck
          npm --prefix tools/docx-diff run test

      # the whole output is kept as an artifact: the first comparison of a newly
      # ported group is read from there, not from a run on somebody's machine
      - name: Parity gate
        if: ${{ !cancelled() && steps.has.outputs.crates == 'true' }}
        shell: bash
        run: |
          mkdir -p tools/docx-diff/out
          npm --prefix tools/docx-diff run gate -- --by-function --show 20 2>&1 | tee tools/docx-diff/out/gate.txt

      - name: Keep the gate output
        if: ${{ always() && steps.has.outputs.crates == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: docx-diff-out
          path: tools/docx-diff/out
          if-no-files-found: ignore

  # Fault injection: each fault of the file through comparison (f), one at a
  # time. It rebuilds the wasm once per fault, which is why it runs here.
  faults:
    if: ${{ inputs.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only

      - name: Rust toolchain with the WASI target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-faults-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Faults
        env:
          FAULTS: ${{ inputs.faults }}
        run: python3 tools/docx-diff/faults.py "$FAULTS"

      - name: Keep the result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docx-diff-faults
          path: tools/docx-diff/out
          if-no-files-found: ignore

  fileparse:
    if: ${{ !inputs.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Is the attachment gate in this tree
        id: has
        run: |
          if [ -f tools/fileparse-diff/package.json ]; then echo "gate=true" >> "$GITHUB_OUTPUT"; else echo "gate=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.gate == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
      - uses: actions/cache@v4
        if: steps.has.outputs.gate == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-fileparse-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-fileparse-${{ runner.os }}-
      - uses: actions/setup-node@v4
        if: steps.has.outputs.gate == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.has.outputs.gate == 'true'
        run: npm ci
      - name: Attachment gate typecheck
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/fileparse-diff run typecheck
      - name: Attachment parity gate
        if: steps.has.outputs.gate == 'true'
        # a zone with daylight saving time: the HWP memo dates are the host's local
        # time, and hwp-cases.ts holds memos on both sides of its changes
        env:
          TZ: America/New_York
        run: npm --prefix tools/fileparse-diff run gate -- --save out/ci.json
      - name: Keep the attachment gate output
        if: always() && steps.has.outputs.gate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fileparse-diff-out
          path: tools/fileparse-diff/out
          if-no-files-found: error

  fileparse_faults:
    needs: fileparse
    if: ${{ !inputs.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Is the attachment fault gate in this tree
        id: has
        run: |
          if [ -f tools/fileparse-diff/faults.json ]; then echo "gate=true" >> "$GITHUB_OUTPUT"; else echo "gate=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.gate == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
      - uses: actions/cache@v4
        if: steps.has.outputs.gate == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-fileparse-faults-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-fileparse-${{ runner.os }}-
      - uses: actions/setup-node@v4
        if: steps.has.outputs.gate == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.has.outputs.gate == 'true'
        run: npm ci
      - name: Build the clean attachment gate
        if: steps.has.outputs.gate == 'true'
        run: node crates/office-wasm/build.mjs
      - name: Attachment seeded faults
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/fileparse-diff run faults
      - name: Keep the fault evidence
        if: always() && steps.has.outputs.gate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fileparse-faults-out
          path: |
            tools/fileparse-diff/out/faults-*/summary.json
            tools/fileparse-diff/out/faults-*/*.json
          if-no-files-found: error

  epub:
    if: ${{ !inputs.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Is the EPUB gate in this tree
        id: has
        run: |
          if [ -f tools/epub-diff/package.json ]; then echo "gate=true" >> "$GITHUB_OUTPUT"; else echo "gate=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.gate == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
      - uses: actions/cache@v4
        if: steps.has.outputs.gate == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-epub-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-fileparse-${{ runner.os }}-
      - uses: actions/setup-node@v4
        if: steps.has.outputs.gate == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.has.outputs.gate == 'true'
        run: npm ci
      - name: EPUB gate typecheck
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/epub-diff run typecheck
      - name: EPUB parity gate
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/epub-diff run gate -- --save out/ci.json
      - name: EPUB seeded faults
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/epub-diff run faults
      - name: Keep the EPUB gate output
        if: always() && steps.has.outputs.gate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: epub-diff-out
          path: |
            tools/epub-diff/out/ci.json
            tools/epub-diff/out/faults-*/*.json
          if-no-files-found: error

  pptx:
    if: ${{ !inputs.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only

      - name: Is the slides gate in this tree
        id: has
        run: |
          if [ -f tools/pptx-diff/package.json ]; then echo "pptx=true" >> "$GITHUB_OUTPUT"; else echo "pptx=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.pptx == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        if: steps.has.outputs.pptx == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-pptx-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        if: steps.has.outputs.pptx == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.has.outputs.pptx == 'true'
        run: npm ci

      - name: Slides gate typecheck
        if: steps.has.outputs.pptx == 'true'
        run: npm --prefix tools/pptx-diff run typecheck

      - name: Slides parity gate
        if: steps.has.outputs.pptx == 'true'
        run: npm --prefix tools/pptx-diff run gate

      - name: Slides fault anchors
        if: steps.has.outputs.pptx == 'true'
        run: npm --prefix tools/pptx-diff run faults -- --inventory

      - name: Keep the slides gate output
        if: always() && steps.has.outputs.pptx == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pptx-diff-out
          path: tools/pptx-diff/out
          if-no-files-found: ignore

  # One Rust fault at a time through the slides gate: each must be caught.
  pptx-faults:
    if: ${{ !inputs.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only

      - name: Is the slides gate in this tree
        id: has
        run: |
          if [ -f tools/pptx-diff/package.json ]; then echo "pptx=true" >> "$GITHUB_OUTPUT"; else echo "pptx=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.pptx == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        if: steps.has.outputs.pptx == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: seuoffice-rust-pptx-faults-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        if: steps.has.outputs.pptx == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.has.outputs.pptx == 'true'
        run: npm ci

      - name: Slides fault probes
        if: steps.has.outputs.pptx == 'true'
        run: npm --prefix tools/pptx-diff run faults -- --shard ${{ matrix.shard }}/8

      - name: Keep the fault probe output
        if: always() && steps.has.outputs.pptx == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pptx-faults-out-${{ matrix.shard }}
          path: tools/pptx-diff/out/faults
          if-no-files-found: ignore
