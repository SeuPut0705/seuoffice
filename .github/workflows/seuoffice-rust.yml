name: seuoffice rust

# The Rust document engines (crates/) and their parity gates against the
# TypeScript engines (tools/docx-diff, tools/pptx-diff), on a GitHub runner.
# Decision 0025.
#
# It runs on its own for a push to main that touches the crates or the gates,
# and by hand on a branch:
#   gh workflow run "seuoffice rust" --ref <branch>
# The workstation that develops the port is shared and slow, which is why the
# full gate runs here.
#
# The `quick` job runs first and every other job needs it: a tree that fails
# rustfmt, clippy, the unit tests or the gate harness's own tests takes one
# runner for minutes instead of the gate's and the faults' runners for an hour.
# A job added here (a gate, a fault matrix) takes `needs: quick` as well.

on:
  push:
    branches: [main]
    paths:
      [
        'crates/**',
        'tools/docx-diff/**',
        'tools/pptx-diff/**',
        'packages/docx-engine/src/**',
        'packages/pptx-engine/src/**',
      ]
  workflow_dispatch:
    inputs:
      faults:
        description: A faults file for tools/docx-diff/faults.py, run instead of the gate (on a rust-faults/* branch)
        required: false
        default: ''
      # 1 while the organisation has few runners; more shards end a long faults
      # file sooner but hold that many runners at once
      fault_shards:
        description: Runners the faults file is split over (FAULT_SHARD of faults.py)
        type: choice
        options: ['1', '2', '4', '8']
        default: '1'
      rhwp_core:
        description: Rebuild vendor/rhwp-core (wasm-pack, tag + patches) and upload it, instead of the gates
        type: boolean
        required: false
        default: false

concurrency:
  group: seuoffice-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    if: ${{ !inputs.rhwp_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # the gate harness's typecheck reads the declarations at MODEL_SOURCE's commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - name: Format
        # the workspace's members only: --all would walk the rhwp source too
        run: cargo fmt --manifest-path crates/Cargo.toml -- --check

      # every check below runs whether or not an earlier one failed, so that one
      # run says everything: the job is red when any of them is
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/Cargo.toml --workspace

      # the vendored regex engine carries patches of its own: its suite runs as published
      - name: Vendored regress tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/vendor/regress/Cargo.toml --features utf16

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Gate harness typecheck and tests
        if: ${{ !cancelled() }}
        run: |
          npm --prefix tools/docx-diff run typecheck
          npm --prefix tools/docx-diff run test

  crates:
    needs: quick
    if: ${{ !inputs.faults && !inputs.rhwp_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only

      - name: Rust toolchain with the WASI target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      # every check below runs whether or not an earlier one failed, so that one
      # run says everything: the job is red when any of them is
      - name: Licences of the dependencies
        run: |
          cargo install cargo-deny --locked
          cd crates && cargo deny check licenses

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: npm

      # a search past the backtrack bound refuses on wasm32 too, where an
      # unbounded stack traps the module
      - name: Regex bound on wasm32
        if: ${{ !cancelled() }}
        run: |
          cargo build --manifest-path crates/Cargo.toml -p jscompat --example limit_wasm --target wasm32-wasip1 --release
          node --no-warnings crates/jscompat/examples/limit_wasm.mjs crates/target/wasm32-wasip1/release/examples/limit_wasm.wasm 25000000

      - name: Install
        if: ${{ !cancelled() }}
        run: npm ci

      # the whole output is kept as an artifact: the first comparison of a newly
      # ported group is read from there, not from a run on somebody's machine
      - name: Parity gate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p tools/docx-diff/out
          npm --prefix tools/docx-diff run gate -- --by-function --show 20 2>&1 | tee tools/docx-diff/out/gate.txt

      - name: Keep the gate output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docx-diff-out
          path: tools/docx-diff/out
          if-no-files-found: ignore

  # Fault injection: each fault of the file through comparison (f), one at a
  # time. It rebuilds the wasm once per fault, which is why it runs here.
  faults:
    needs: quick
    if: ${{ inputs.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # the shard indices of the fault_shards choice; a matrix cannot count to n itself
        shard: ${{ fromJSON('{"1":[0],"2":[0,1],"4":[0,1,2,3],"8":[0,1,2,3,4,5,6,7]}')[inputs.fault_shards || '1'] }}
    steps:
      # the model group reads the declarations at MODEL_SOURCE's commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only

      - name: Rust toolchain with the WASI target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-rust-faults-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-rust-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Faults
        env:
          FAULTS: ${{ inputs.faults }}
          FAULT_SHARD: ${{ matrix.shard }}/${{ inputs.fault_shards || '1' }}
        run: python3 tools/docx-diff/faults.py "$FAULTS"

      - name: Keep the result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          # one shard keeps the name the trail and crates/README.md cite
          name: docx-diff-faults${{ inputs.fault_shards != '1' && inputs.fault_shards && format('-{0}', matrix.shard) || '' }}
          path: tools/docx-diff/out
          if-no-files-found: ignore

  # The attachment gate over four shards of its specs: one job ran 46-58 of its
  # 60 minutes and reached the limit
  fileparse:
    needs: quick
    if: ${{ !inputs.faults && !inputs.rhwp_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Is the attachment gate in this tree
        id: has
        run: |
          if [ -f tools/fileparse-diff/package.json ]; then echo "gate=true" >> "$GITHUB_OUTPUT"; else echo "gate=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.gate == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
      - uses: actions/cache@v4
        if: steps.has.outputs.gate == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-fileparse-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-fileparse-${{ runner.os }}-
      - uses: actions/setup-node@v4
        if: steps.has.outputs.gate == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.has.outputs.gate == 'true'
        run: npm ci
      - name: Attachment gate typecheck
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/fileparse-diff run typecheck
      - name: Attachment parity gate
        if: steps.has.outputs.gate == 'true'
        # a zone with daylight saving time: the HWP memo dates are the host's local
        # time, and hwp-cases.ts holds memos on both sides of its changes
        env:
          TZ: America/New_York
        run: npm --prefix tools/fileparse-diff run gate -- --shard ${{ matrix.shard }}/4 --save out/ci-${{ matrix.shard }}.json
      - name: Keep the attachment gate output
        if: always() && steps.has.outputs.gate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fileparse-diff-out-${{ matrix.shard }}
          path: tools/fileparse-diff/out
          if-no-files-found: error

  fileparse_faults:
    needs: [quick, fileparse]
    if: ${{ !inputs.faults && !inputs.rhwp_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # every fault rebuilds the wasm: one job ran out of time at about 16 of
    # them, so eight jobs each take every eighth fault
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Is the attachment fault gate in this tree
        id: has
        run: |
          if [ -f tools/fileparse-diff/faults.json ]; then echo "gate=true" >> "$GITHUB_OUTPUT"; else echo "gate=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.gate == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
      - uses: actions/cache@v4
        if: steps.has.outputs.gate == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-fileparse-faults-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-fileparse-${{ runner.os }}-
      - uses: actions/setup-node@v4
        if: steps.has.outputs.gate == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.has.outputs.gate == 'true'
        run: npm ci
      - name: Build the clean attachment gate
        if: steps.has.outputs.gate == 'true'
        run: node crates/office-wasm/build.mjs
      - name: Attachment seeded faults
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/fileparse-diff run faults -- --shard ${{ matrix.shard }}/8
      - name: Keep the fault evidence
        if: always() && steps.has.outputs.gate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fileparse-faults-out-${{ matrix.shard }}
          path: |
            tools/fileparse-diff/out/faults-*/summary.json
            tools/fileparse-diff/out/faults-*/*.json
          if-no-files-found: error

  epub:
    needs: quick
    if: ${{ !inputs.faults && !inputs.rhwp_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Is the EPUB gate in this tree
        id: has
        run: |
          if [ -f tools/epub-diff/package.json ]; then echo "gate=true" >> "$GITHUB_OUTPUT"; else echo "gate=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.gate == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
      - uses: actions/cache@v4
        if: steps.has.outputs.gate == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-epub-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-fileparse-${{ runner.os }}-
      - uses: actions/setup-node@v4
        if: steps.has.outputs.gate == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.has.outputs.gate == 'true'
        run: npm ci
      - name: EPUB gate typecheck
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/epub-diff run typecheck
      - name: EPUB parity gate
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/epub-diff run gate -- --save out/ci.json
      - name: Keep the EPUB gate output
        if: always() && steps.has.outputs.gate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: epub-diff-out
          path: tools/epub-diff/out/ci.json
          if-no-files-found: error

  # One Rust fault at a time through the EPUB gate, each rebuilding the wasm:
  # eight shards keep every one well inside its limit
  epub_faults:
    needs: [quick, epub]
    if: ${{ !inputs.faults && !inputs.rhwp_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      # the hwp reader compiles rhwp from upstream v0.9.0 with vendor/rhwp-core's
      # patches; cargo resolves that path dependency on every call, so it is
      # prepared before any of them
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('vendor/rhwp-core/**', 'tools/build-rhwp-core.mjs') }}
      - name: rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Is the EPUB gate in this tree
        id: has
        run: |
          if [ -f tools/epub-diff/package.json ]; then echo "gate=true" >> "$GITHUB_OUTPUT"; else echo "gate=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust toolchain with the WASI target
        if: steps.has.outputs.gate == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
      - uses: actions/cache@v4
        if: steps.has.outputs.gate == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: seuoffice-epub-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: seuoffice-fileparse-${{ runner.os }}-
      - uses: actions/setup-node@v4
        if: steps.has.outputs.gate == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.has.outputs.gate == 'true'
        run: npm ci
      - name: EPUB seeded faults
        if: steps.has.outputs.gate == 'true'
        run: npm --prefix tools/epub-diff run faults -- --shard ${{ matrix.shard }}/8
      - name: Keep the EPUB fault evidence
        if: always() && steps.has.outputs.gate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: epub-faults-out-${{ matrix.shard }}
          path: tools/epub-diff/out/faults-*/*.json
          if-no-files-found: error

  # vendor/rhwp-core is the wasm-bindgen build the desktop ships. A patch added
  # to vendor/rhwp-core/patches changes it only once it is rebuilt: dispatch
  # with rhwp_core, then commit the files of the artifact over vendor/rhwp-core.
  rhwp_core:
    if: ${{ inputs.rhwp_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the tag's rust-toolchain.toml picks the toolchain and wasm32-unknown-unknown
      - name: wasm-pack 0.15.0
        run: cargo install --locked wasm-pack --version 0.15.0
      - name: Build vendor/rhwp-core
        run: node tools/build-rhwp-core.mjs
      - name: What was built
        run: |
          sha256sum vendor/rhwp-core/rhwp_bg.wasm
          git diff --stat -- vendor/rhwp-core
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-core
          path: |
            vendor/rhwp-core/rhwp.js
            vendor/rhwp-core/rhwp.d.ts
            vendor/rhwp-core/rhwp_bg.wasm
            vendor/rhwp-core/rhwp_bg.wasm.d.ts
            vendor/rhwp-core/LICENSE
            vendor/rhwp-core/THIRD_PARTY_LICENSES.md
            vendor/rhwp-core/package.json
          if-no-files-found: error
