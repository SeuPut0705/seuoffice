name: CI

# Test gate for every PR and push: changed-file formatting, lint, typecheck across
# all workspaces, and the full unit-test suite (engine packages and app tests; the
# sheets suite also runs the Rust xlsx-sidecar tests). Installers are built and
# published by seuoffice-desktop.yml — this workflow never builds or uploads
# one, and it uses no repository secret.

on:
  # seuoffice: a Markdown-only change skips this ~100 minute gate; the seuoffice workflow still runs
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # seuoffice: the workspaces' tests run as four shares on four runners at once
    # (tools/seuoffice-test-shard.mjs); lint and typecheck run on the first only
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4]
    # seuoffice: 60, not 45; a cold cargo cache (saved only after a green run) pushes the suite past 45
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        # SHA-pinned (third-party action); the ref no longer selects the
        # toolchain, so it is passed explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Cache cargo (xlsx-sidecar, office-wasm)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            apps/sheets/native/xlsx-engine
            crates

      # electron's postinstall downloads its binary from GitHub Releases on every
      # fresh install; a cache hit skips the download (and its 5xx flakes)
      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          # own prefix: the build workflows' electron-* entries also hold
          # ~/.cache/electron-builder, and a saved key is never updated
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # the docx engine is the Rust engine through crates/office-wasm: the tests,
      # the fixtures and every app build load the wasm file
      - name: Build the engine wasm
        run: npm run build:wasm

      - name: Check dependency licenses
        run: npm run licenses

      - name: Check Rust dependency licenses (xlsx-sidecar)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          manifest-path: apps/sheets/native/xlsx-engine/Cargo.toml

      - name: Check formatting
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        # For PRs the checkout is the PR merge commit, so its first parent is the
        # exact main revision the merge was built against. The event's base.sha can
        # lag behind a fast-moving main, which pulls unrelated main-side files into
        # the changed-file set and fails the check on files the PR never touched.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run format:check

      - name: Check theme colors
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:theme-colors

      # Inline text-layout decisions (script tests, face predicates, CJK ranges,
      # compat reads) stay in apps/docs/src/renderer/text-layout/, not in the emitters.
      - name: Check inline text-layout rules
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:inline-rules

      # Line-metric numbers (fonts.css size-adjust/overrides, knownLineFactor)
      # must cite the Word measurement they came from.
      - name: Check font-metric provenance
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:font-metrics-provenance

      # skills/*/SKILL.md ship to users' agent directories; a body change
      # without a metadata.version bump would never be offered as an update.
      - name: Check skill versions
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:skill-version

      # Whole-tree, not changed-files: every language of the manual
      # has to match the English article's structure. A language that quietly
      # falls behind is exactly what no reviewer sees, and it is invisible in a
      # diff — the change that causes it looks like an ordinary translation.
      - name: Check manual language coverage
        run: npm run check:help-langs

      # Keep tracked code comments and contributor-facing documentation
      # English-only; functional CJK strings and AI prompt examples are allowed.
      - name: Check comments/docs are English-only
        run: npm run check:english-comments

      - name: Lint
        if: matrix.share == 1
        run: npm run lint

      - name: Typecheck
        if: matrix.share == 1
        run: npm run typecheck

      - name: Regenerate test fixtures
        run: npm run fixtures

      # Generation is byte-deterministic (zip entry mtimes are pinned in
      # tests/helpers/build-docx.ts); a diff here means the generator and the
      # committed fixtures have drifted apart.
      - name: Check committed fixtures match the generator
        run: git diff --exit-code -- fixtures/generated

      # pptx-engine's OOXML schema gate validates saved decks with xmllint
      # (tools/ooxml-validate); the runner image is not guaranteed to have it.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      # `sheet apply`'s dependent-cache audit lives in the Rust xlsx-sidecar, and
      # the CLI suite skips its sidecar-backed tests (`it.skipIf(!sidecar)`) when
      # the binary is missing. Only the sheets package's test script builds it,
      # and the root `test` script runs @seuoffice/cli before @seuoffice/sheets —
      # so build the sidecar up front or CI's pass proves nothing about the
      # audit. The cargo cache above holds the target dir, so this is cheap.
      - name: Build xlsx-sidecar (the CLI audit tests run against it)
        run: |
          npm run native:build -w @seuoffice/sheets
          # the sidecar-gated CLI tests read the generated compatibility fixture
          # (gitignored, normally produced by the sheets gate below)
          npm run fixtures -w @seuoffice/sheets

      - name: Test
        run: node tools/seuoffice-test-shard.mjs ${{ matrix.share }} 4

      # Preservation gate: a no-op-adjacent edit through the OOXML gateway must
      # leave every untouched package entry byte-identical (fails closed otherwise).
      - name: Sheets compatibility gate
        run: |
          npm run fixtures -w @seuoffice/sheets
          npm run compat -w @seuoffice/sheets

  e2e:
    # 22.04, not -latest: 24.04's AppArmor hardening blocks Electron renderer
    # spawn under xvfb even with --no-sandbox and the userns sysctl lifted
    runs-on: ubuntu-22.04
    # seuoffice: the Electron suite runs as six Playwright shards on six runners at once
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # A cold font install took 24m in #124; leave room for the full serial
    # Electron suite as well as setup. Individual test timeouts stay unchanged.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Cache cargo (xlsx-sidecar, office-wasm)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            apps/sheets/native/xlsx-engine
            crates

      # electron's postinstall downloads its binary from GitHub Releases on every
      # fresh install; a cache hit skips the download (and its 5xx flakes)
      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          # own prefix: the build workflows' electron-* entries also hold
          # ~/.cache/electron-builder, and a saved key is never updated
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build apps
        run: npm run build:all

      - name: Generate sheets fixtures
        run: npm run fixtures -w @seuoffice/sheets

      # Newer Ubuntu kernels ship an AppArmor policy that blocks unprivileged
      # user namespaces, which kills the Chromium zygote even with --no-sandbox
      # (window opens, renderer never loads). The knob only exists on kernels
      # that enforce the restriction, so skip it where it is absent instead of
      # failing the job (22.04 runner images vary by kernel).
      - name: Allow unprivileged user namespaces (Electron)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not present — skipping"
          fi

      # Pixel baselines (docs-visual.spec.ts) depend on the font stack: pin
      # Calibri/Cambria metric-compatible faces and CJK glyphs so renders are
      # reproducible across runner images and contributor machines.
      # seuoffice: the three packages are 62 MB, and on a slow mirror the download
      # alone took 8 min (133 kB/s, run 42696128307), so they are kept in a cache
      # and installed from it. Raise v1 to take newer packages from the archive.
      - name: Cache document font packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/font-debs
          key: e2e-font-debs-ubuntu-22.04-v1

      - name: Install document fonts (visual baselines)
        run: |
          if ! ls ~/font-debs/*.deb >/dev/null 2>&1; then
            sudo apt-get update
            mkdir -p ~/font-debs
            (cd ~/font-debs && apt-get download \
              fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-cjk)
          fi
          sudo dpkg -i ~/font-debs/*.deb

      # CSS layout tests use standalone Chromium in addition to Electron.
      # Keep the pinned document font stack unchanged: --with-deps adds fonts
      # that alter the existing pixel baselines. Electron already supplies the
      # required system libraries on this runner.
      - name: Install Chromium for layout tests
        run: npx playwright install chromium

      - name: Markdown browser tests
        # seuoffice: on the shard whose Electron share is shortest
        if: matrix.shard == 4
        run: npx playwright test --config apps/markdown/playwright.config.ts

      # Electron needs a display server on Linux runners. DEBUG=pw:browser
      # forwards the Electron process stdout/stderr into the CI log so launch
      # failures are diagnosable.
      - name: E2E (Electron shell)
        env:
          DEBUG: 'pw:browser'
        run: xvfb-run --auto-servernum -- npm run test:e2e -- --shard=${{ matrix.shard }}/6

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.shard }}
          path: |
            e2e/artifacts
            e2e/test-results
          retention-days: 7
