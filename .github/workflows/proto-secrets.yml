name: proto secrets

# Throwaway prototype (decision 0026): can Rust open what Electron safeStorage sealed.
# Never merges to main. Runs on pushes to proto/rust-shell and by hand.
on:
  push:
    branches: [proto/rust-shell]
    paths:
      - 'proto/secrets/**'
      - 'proto/common/**'
      - '.github/workflows/proto-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove it (macOS)
        run: bash proto/secrets/ci/mac.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto-secrets-mac
          path: ${{ runner.temp }}/secrets-proof/out
          if-no-files-found: warn

  win:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove it (Windows)
        shell: pwsh
        run: ./proto/secrets/ci/win.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto-secrets-win
          path: ${{ runner.temp }}/secrets-proof/out
          if-no-files-found: warn
