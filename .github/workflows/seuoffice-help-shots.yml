name: seuoffice help screenshots

# Regenerates the manual's app screenshots (tools/gen-help-screenshots.ts) on a
# clean Windows runner, where no AI program is signed in, so the figures show
# the current product name and logo and nothing of a developer's own session.
# Started by hand; the figures come back as an artifact to commit.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Install dependencies
        run: npm ci

      - name: Build apps
        run: npm run build:all

      - name: Take the screenshots
        run: npx tsx tools/gen-help-screenshots.ts

      - name: Upload the figures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: help-screenshots
          path: apps/shell/src/renderer/src/i18n/help/topics/img/
          if-no-files-found: error
          retention-days: 7
