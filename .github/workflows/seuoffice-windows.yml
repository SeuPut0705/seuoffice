name: seuoffice Windows

# Builds the seuoffice Windows installer (x64 NSIS) on a GitHub-hosted runner
# from this repository and publishes it to a GitHub release.
#
# Two flavors are built from one compiled app, one packaging pass each:
#   latest  seuoffice-Setup-<version>.exe         feed latest.yml
#           For general builds. Their updater also looks at GitHub pre-releases.
#   stable  seuoffice-Setup-<version>-stable.exe  feed stable.yml
#           Its updater only looks at GitHub's "Latest" full release.
# SEUOFFICE_UPDATE_CHANNEL selects the pass (see apps/shell/electron-builder.cjs).
#
# Release model. A tag vX.Y.Z creates (or refreshes) a GitHub PRE-RELEASE that
# carries both flavors, so general builds get it at once. The workflow never
# promotes it. The owner promotes a release to stable by hand, later:
#   gh release edit vX.Y.Z --prerelease=false --latest
#
# Signing. electron-builder signs with signtool when the repository secrets
# WIN_CSC_LINK (base64 PFX or https URL) and WIN_CSC_KEY_PASSWORD are set. It
# then signs seuoffice.exe, the uninstaller, the installer and the .exe files
# copied through extraResources. Without them the build is unsigned, and an
# unsigned build stays a workflow artifact: it is checked and uploaded, never
# released. The first published release must be signed, because a signed
# release locks every later update to its signer (docs/releasing.ko.md).
#
# A run started by hand (workflow_dispatch) builds and uploads the artifact
# only, unless it is started on a v* tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: seuoffice-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # the provenance attestation: an OIDC token and the right to store it
      id-token: write
      attestations: write
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      # never pick up a certificate from the runner: only WIN_CSC_* signs
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-${{ runner.arch }}-

      # signed=true only when both secrets are non-empty; the values are read
      # from the environment and never printed
      - name: Detect the signing certificate
        id: signing
        env:
          HAS_LINK: ${{ secrets.WIN_CSC_LINK != '' }}
          HAS_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          signed=false
          if [ "$HAS_LINK" = "true" ] && [ "$HAS_PASSWORD" = "true" ]; then
            signed=true
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "signed=$signed"

      - name: Install dependencies
        run: npm ci

      # build:all builds the sheets module, which builds the xlsx sidecar for
      # this host (target/release/xlsx-sidecar.exe)
      - name: Build apps
        run: npm run build:all
        # the Google Drive client goes into the shell build; without it the
        # build ships without Drive
        env:
          GENOFFICE_GOOGLE_CLIENT_ID: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_ID }}
          GENOFFICE_GOOGLE_CLIENT_SECRET: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_SECRET }}

      # the Windows config reads the sidecar from the x86_64-pc-windows-gnu
      # folder (docs/releasing.ko.md, 4-(2)); the hand build copies it the same way
      - name: Place the xlsx sidecar
        run: |
          set -euo pipefail
          engine=apps/sheets/native/xlsx-engine/target
          mkdir -p "$engine/x86_64-pc-windows-gnu/release"
          cp "$engine/release/xlsx-sidecar.exe" "$engine/x86_64-pc-windows-gnu/release/"

      # pass 1, the general flavor (channel latest): builds the JS too
      - name: Package (latest channel)
        run: npm run dist:win -w @genoffice/shell -- --publish never
        env:
          GENOFFICE_GOOGLE_CLIENT_ID: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_ID }}
          GENOFFICE_GOOGLE_CLIENT_SECRET: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_SECRET }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # pass 2, the stable flavor: reuses the JS pass 1 built, only repackages
      - name: Package (stable channel)
        working-directory: apps/shell
        run: npx electron-builder --win --publish never
        env:
          SEUOFFICE_UPDATE_CHANNEL: stable
          BUILD_DIR: release-stable
          GENOFFICE_GOOGLE_CLIENT_ID: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_ID }}
          GENOFFICE_GOOGLE_CLIENT_SECRET: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_SECRET }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # a release build should carry the Drive client; say so when it does not
      - name: The Google Drive client is in the build
        env:
          HAS_CLIENT: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_ID != '' }}
        run: |
          if [ "$HAS_CLIENT" != "true" ]; then
            echo "::warning::GENOFFICE_GOOGLE_CLIENT_ID is not set; this build ships without Google Drive"
            exit 0
          fi
          grep -rqs "apps.googleusercontent.com" apps/shell/out/main || {
            echo "::error::the Google Drive client did not reach the shell build"
            exit 1
          }

      - name: Check the installers, their feeds and the bundled programs
        run: |
          set -euo pipefail
          shell=apps/shell
          latest="$shell/release"
          stable="$shell/release-stable"
          unpacked="$latest/win-unpacked"

          for bin in \
            "$unpacked/seuoffice.exe" \
            "$unpacked/resources/native/xlsx-sidecar.exe" \
            "$unpacked/resources/ocr/win-ocr.exe" \
            "$unpacked/resources/cli/genoffice.cjs" \
            "$unpacked/resources/cli/ieumoffice.cmd"; do
            test -f "$bin" || { echo "missing: $bin"; exit 1; }
          done

          # exact whole-line match, tolerant of CRLF
          has_line() { tr -d '\r' < "$1" | grep -Fxq -- "$2"; }

          version=$(node -p "require('./apps/shell/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json version is $version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

          check_flavor() {
            local dir=$1 channel=$2 feed=$3 installer=$4
            test -f "$dir/$installer" || { echo "missing: $dir/$installer"; exit 1; }
            test -f "$dir/$installer.blockmap" || { echo "missing: $dir/$installer.blockmap"; exit 1; }
            test -f "$dir/$feed" || { echo "missing: $dir/$feed"; exit 1; }
            local built
            built=$(sed -n 's/^version: *//p' "$dir/$feed" | tr -d "'\"\r")
            [ "$built" = "$version" ] || { echo "$feed says $built, package.json $version"; exit 1; }
            has_line "$dir/$feed" "path: $installer" || { echo "$feed path is not $installer"; exit 1; }
            local update="$dir/win-unpacked/resources/app-update.yml"
            test -f "$update" || { echo "missing: $update"; exit 1; }
            for line in "channel: $channel" "repo: seuoffice" "owner: SeuPut0705"; do
              has_line "$update" "$line" || { echo "$update lacks '$line'"; exit 1; }
            done
          }
          check_flavor "$latest" latest latest.yml "seuoffice-Setup-$version.exe"
          check_flavor "$stable" stable stable.yml "seuoffice-Setup-$version-stable.exe"

          # every signable file must be signed, or none: a half-signed build fails
          expected=NotSigned
          if [ "$SIGNED" = "true" ]; then
            expected=Valid
          else
            echo "::warning::No signing certificate: this build is for testing only and cannot be released."
          fi
          for file in \
            "$latest/seuoffice-Setup-$version.exe" \
            "$stable/seuoffice-Setup-$version-stable.exe" \
            "$unpacked/seuoffice.exe" \
            "$unpacked/resources/native/xlsx-sidecar.exe"; do
            status=$(powershell -NoProfile -Command "(Get-AuthenticodeSignature -LiteralPath '$file').Status" | tr -d '\r')
            echo "$status  $file"
            [ "$status" = "$expected" ] || { echo "::error::$file is $status, expected $expected"; exit 1; }
          done
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}

      # The packaged app itself, run without a window: a Markdown and a CSV file
      # (the latter through the xlsx sidecar) are exported to PDF
      - name: Smoke test the packaged app
        run: |
          set -euo pipefail
          exe="apps/shell/release/win-unpacked/seuoffice.exe"
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          printf '# Smoke test\n\nHello from the Windows build.\n' > "$work/note.md"
          printf 'name,count\napple,3\npear,5\n' > "$work/table.csv"
          for input in note.md table.csv; do
            "$exe" --headless-export "$work/$input" --to pdf --out "$work/$input.pdf" --json
            test -s "$work/$input.pdf"
          done

      # one flat folder, so the artifact has no release/ and release-stable/ levels
      - name: Collect the release files
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/shell/package.json').version")
          mkdir -p release-files
          cp "apps/shell/release/seuoffice-Setup-$version.exe" \
            "apps/shell/release/seuoffice-Setup-$version.exe.blockmap" \
            "apps/shell/release/latest.yml" \
            "apps/shell/release-stable/seuoffice-Setup-$version-stable.exe" \
            "apps/shell/release-stable/seuoffice-Setup-$version-stable.exe.blockmap" \
            "apps/shell/release-stable/stable.yml" \
            release-files/
          ls -la release-files

      # where the installers came from: this repository, this commit, this workflow
      - name: Attest the build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-files/seuoffice-Setup-*.exe
            release-files/latest.yml
            release-files/stable.yml

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seuoffice-windows-x64
          path: |
            release-files/seuoffice-Setup-*.exe
            release-files/seuoffice-Setup-*.exe.blockmap
            release-files/latest.yml
            release-files/stable.yml
          if-no-files-found: error
          retention-days: 14

  release:
    # the one job that writes: a pre-release carrying both flavors, from a tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # first, before any release is touched
      - name: Refuse an unsigned build
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::error::The build is unsigned, so it is never released. Set the WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD secrets and run again. The first published release must be signed, because a signed release later locks updates to its signer (docs/releasing.ko.md)."
            exit 1
          fi

      - name: Publish the pre-release
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name seuoffice-windows-x64 --dir windows
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version tag: $TAG"; exit 1; }
          built=$(sed -n 's/^version: *//p' windows/latest.yml | tr -d "'\"\r")
          [ "v$built" = "$TAG" ] || { echo "::error::built $built, but the tag is $TAG"; exit 1; }
          version=${TAG#v}
          files=(
            "windows/seuoffice-Setup-$version.exe"
            "windows/seuoffice-Setup-$version.exe.blockmap"
            "windows/latest.yml"
            "windows/seuoffice-Setup-$version-stable.exe"
            "windows/seuoffice-Setup-$version-stable.exe.blockmap"
            "windows/stable.yml"
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "::error::missing: $file"; exit 1; }
          done
          # an existing release keeps its pre-release and latest state
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" \
              --notes "Windows installers for $TAG. Pre-release: the general (latest) update channel gets it now. Promote it to the stable channel with: gh release edit $TAG --prerelease=false --latest" \
              "${files[@]}"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
