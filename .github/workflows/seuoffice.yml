name: seuoffice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GenOffice ee/ stays out
        run: test -z "$(git ls-files ee)"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # no job here runs Electron: --ignore-scripts skips its 100 MB download (and its outages)
      - run: npm ci --ignore-scripts
      - run: npm run check:english-comments

  web:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: npm ci --ignore-scripts
      # the docx engine of every module is crates/office-wasm
      - run: npm run build:wasm
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck -w @seuoffice/web-platform -w @seuoffice/embed -w @seuoffice/collab -w @seuoffice/web
      - run: npm run test -w @seuoffice/web-platform -w @seuoffice/embed -w @seuoffice/collab
      - run: npm run build -w @seuoffice/web
      - run: npm run test -w @seuoffice/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
