name: seuoffice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# no job here runs Electron; skip its 100 MB download (and its outages)
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GenOffice ee/ stays out
        run: test -z "$(git ls-files ee)"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:no-genspark
      - run: npm run check:english-comments

  web:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck -w @seuoffice/web-platform -w @seuoffice/embed -w @seuoffice/web
      - run: npm run test -w @seuoffice/web-platform -w @seuoffice/embed
      - run: npm run build -w @seuoffice/web
      - run: npm run test -w @seuoffice/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
