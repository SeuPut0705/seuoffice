[package]
name = "main-core"
description = "The central process of SeuOffice (the Electron main process), ported from apps/*/src/main"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jscompat.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

# the file identity of fs.statSync on Windows (rename_validation::is_same_file)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
