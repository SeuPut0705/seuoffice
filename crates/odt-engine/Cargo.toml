[package]
name = "odt-engine"
description = "The OpenDocument Text bridge: ODT to the bridge docx, the narrow save back into the ODT, docx to a new ODT"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
docx-engine.workspace = true
flate2.workspace = true
jscompat.workspace = true
ooxml-pkg.workspace = true
ooxml-xml.workspace = true
serde.workspace = true
serde_json.workspace = true

# a native build sorts the INDEX field with ICU4X; the wasm build asks the host
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
docx-engine = { workspace = true, features = ["icu-collation"] }
