[package]
name = "shell-ipc-u"
description = "Stage 3 batch U: Updates, install, crash and recovery. Handlers of its channels in shell-contract's CHANNELS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# the fakes of this batch's hosts for crates/ipc-probe (tools/ipc-diff)
probe = ["dep:serde_json"]

[dependencies]
shell-contract = { path = "../../shell-contract" }
serde_json = { workspace = true, optional = true }
