# The licences the crates of this workspace may depend on. The runner checks
# it (`cargo deny check licenses`). encoding_rs is (Apache-2.0 OR MIT) AND
# BSD-3-Clause: it has to be in the third-party notices once the crates are
# wired into the product.

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "MPL-2.0",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
]
