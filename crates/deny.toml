# cargo-deny: the licences the crates of this workspace may depend on.
# The runner checks it (`cargo deny check licenses`); a crate under another
# licence fails the job, and the list grows only with the owner's word.
#
# encoding_rs is (Apache-2.0 OR MIT) AND BSD-3-Clause: it has to be in the
# third-party notices once the crates are wired into the product.

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MPL-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
