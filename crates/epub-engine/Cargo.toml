[package]
name = "epub-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
primitives = []
ranges = []
package = ["primitives", "xml-positions-types"]
utf16 = []
xml-positions-types = ["utf16"]
blocks = ["ranges", "xml-positions-types"]
notation = ["blocks"]
marks = ["notation"]
edits = ["marks", "notation", "blocks", "ranges"]
pdf-structure = ["utf16", "dep:sha2", "dep:icu_normalizer"]
translate = ["pdf-structure", "notation", "blocks"]
pure = ["edits", "translate"]
# the readers of XML (saxes) and HTML (the host's parse5), and the chapter text
xml = ["package", "xml-positions-types", "dep:saxes", "dep:seu-host"]
# opening, the table of contents and saving a book
book = ["xml", "ranges", "dep:ooxml-pkg"]
# the translated book and the translation job parts
book-translate = ["book", "translate", "edits"]

[dependencies]
jscompat.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
# NFC of `String.prototype.normalize`, for the store keys of a book translation
icu_normalizer = { version = "2", optional = true }
ooxml-pkg = { workspace = true, optional = true }
saxes = { workspace = true, optional = true }
seu-host = { workspace = true, optional = true }
