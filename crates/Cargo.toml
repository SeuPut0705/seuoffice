[workspace]
members = [
  "jscompat",
  "ooxml-xml",
  "ooxml-pkg",
  "docx-engine",
  "pptx-engine",
  "mtx",
  "omml",
  "office-wasm",
  "spike-one-run-save",
  "main-core",
  "main-node",
  "shell-contract",
  # one crate per stage 3 area batch: shell-ipc/u, a, m, w, d1, d2
  "shell-ipc/*",
  # the shell's IPC core without Tauri (wire form, channel table, dispatch)
  "shell-core",
]
# vendor: third-party source carried with patches, outside fmt, clippy and the
# workspace tests; spike-main-bridge: an experiment with its own lock
# shell: the Tauri 3 + CEF app, its own workspace and lock, built on the Mac
# and Windows runners only (CEF is a download of about 1 GB)
exclude = ["vendor", "spike-main-bridge", "shell"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
jscompat = { path = "jscompat" }
ooxml-xml = { path = "ooxml-xml" }
ooxml-pkg = { path = "ooxml-pkg" }
# without icu-collation: each member names it, so the wasm build can leave it out
docx-engine = { path = "docx-engine", default-features = false }
pptx-engine = { path = "pptx-engine" }
mtx = { path = "mtx" }
omml = { path = "omml" }
# the decoders of the Encoding Standard, which TextDecoder follows
encoding_rs = "0.8"
# the inflater the zip crate already uses; entries are read without its CRC check
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# the platform's random source (WASI random_get on wasm32): Math.random and
# crypto.randomUUID
getrandom = "0.4"
# fdlibm in Rust: Math.pow as V8 computes it, whatever libm the platform has
libm = "0.2"
# ECMAScript regular expressions: patterns are ported by copying them;
# utf16: a text outside the BMP is searched as UTF-16 units, as JavaScript does
regress = { version = "0.12", features = ["utf16"] }
# shortest float digits with the tie rule of JavaScript
ryu = "1"
# errno numbers of the platform, read as Node names them (main-core node_fs)
libc = "0.2"
# Node-API: the central process calls main-core in the Electron main process (decision 0030)
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
napi-build = "2"
main-core = { path = "main-core" }
serde = { version = "1", features = ["derive"] }
# preserve_order: a value keeps its keys in the order they were written, as a
# JavaScript object does; without it serde_json::Value sorts them
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# SHA-512 of the document protection hash
sha2 = "0.10"
# SHA-1 of crypto.createHash('sha1') in the central process (jscompat::sha1_hex)
sha1 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# regress 0.12.0 with a bounded backtrack stack and lazy loops that do not walk
# ahead: see vendor/regress/VENDORED.md
[patch.crates-io]
regress = { path = "vendor/regress" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the Node-API addon of the central process (main-node): as release, but a
# panic unwinds, so napi turns it into a JavaScript error instead of ending
# the Electron main process (decision 0030)
[profile.node]
inherits = "release"
panic = "unwind"

# the addon as fault injection builds it, once per fault: unoptimized and
# incremental, so a fault rebuilds main-core alone in seconds
[profile.node-faults]
inherits = "dev"
panic = "unwind"
