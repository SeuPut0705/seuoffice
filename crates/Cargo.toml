[workspace]
members = ["ooxml-xml", "ooxml-pkg", "docx-engine", "office-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ooxml-xml = { path = "ooxml-xml" }
ooxml-pkg = { path = "ooxml-pkg" }
docx-engine = { path = "docx-engine" }
# the inflater the zip crate already uses; entries are read without its CRC check
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
