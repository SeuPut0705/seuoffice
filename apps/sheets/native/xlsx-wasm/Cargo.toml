[package]
name = "xlsx-wasm"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xlsx-sidecar = { path = "../xlsx-engine" }

# Keeps the crate out of the desktop workspace: it only builds for wasm32-wasip1
[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
