<!--
  SeuOffice logo lockup (source of truth for the in-app sidebar logo).

  Pure black and white on purpose: the shell flips it for dark themes with a
  CSS invert filter, so it must not carry any colour.

  The mark is the fanned cards of apps/shell/build/brand/app-icon.svg in a
  single colour: black cards separated by white gaps, with a white spark on
  the top card. The wordmark is "SeuOffice" set in Roboto Bold 2.137 (Apache
  License 2.0) and converted to outlines so it renders without the font
  installed. See NOTICE.

  Copied verbatim to apps/shell/src/renderer/src/assets/genoffice-logo.svg by
    node tools/gen-brand-assets.mjs
  Keep the 976x240 canvas: the sidebar sizes the logo by height.
-->
