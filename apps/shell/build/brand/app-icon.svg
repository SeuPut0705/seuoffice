<?xml version="1.0" encoding="UTF-8"?>
<!--
  SeuOffice app icon (source of truth).

  The mark is the S of SeuOffice drawn as two strokes that meet in the middle
  of the letter: the upper curve in white, the lower curve in amber, on an
  indigo tile.

  Every raster/container icon in the repo is derived from this file:
    node tools/gen-brand-assets.mjs
  Keep the 1024x1024 canvas and the full-bleed rounded tile; the generator
  insets the whole drawing for the macOS variants.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="230" fill="#4338CA"/>
  <g fill="none" stroke-width="116" stroke-linecap="round">
    <path d="M 668 352 A 156 146 0 1 0 512 512" stroke="#FFFFFF"/>
    <path d="M 512 512 A 156 146 0 1 1 356 672" stroke="#FFB020"/>
  </g>
</svg>
