<?xml version="1.0" encoding="UTF-8"?>
<!--
  SeuOffice app icon, small optical size (16-32 px slots).

  Same fanned cards as app-icon.svg with a larger spark (scale 104 instead of
  78) so it still shows at one or two pixels across in a taskbar or title bar.

  Used by tools/gen-brand-assets.mjs for canvases of 32 px and below.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="230" fill="#FFFFFF"/>
  <g transform="translate(14 -24)">
    <rect x="-200" y="-200" width="400" height="400" rx="92" fill="#FFB020" transform="translate(412 590) rotate(-26)"/>
    <rect x="-200" y="-200" width="400" height="400" rx="92" fill="#6D5DF6" transform="translate(500 534) rotate(-12)"/>
    <rect x="-210" y="-210" width="420" height="420" rx="96" fill="#4338CA" transform="translate(612 470)"/>
    <path d="M0 -1 C0.12 -0.28 0.28 -0.12 1 0 C0.28 0.12 0.12 0.28 0 1 C-0.12 0.28 -0.28 0.12 -1 0 C-0.28 -0.12 -0.12 -0.28 0 -1 Z" fill="#FFFFFF" transform="translate(690 390) scale(104)"/>
  </g>
</svg>
