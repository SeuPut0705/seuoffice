<?xml version="1.0" encoding="UTF-8"?>
<!--
  SeuOffice app icon, small optical size (16-32 px slots).

  Same S as app-icon.svg with a bolder stroke (150 instead of 116 units) so the
  two curves stay solid at one or two pixels per stroke edge in a taskbar or
  title bar.

  Used by tools/gen-brand-assets.mjs for canvases of 32 px and below.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="230" fill="#4338CA"/>
  <g fill="none" stroke-width="150" stroke-linecap="round">
    <path d="M 668 352 A 156 146 0 1 0 512 512" stroke="#FFFFFF"/>
    <path d="M 512 512 A 156 146 0 1 1 356 672" stroke="#FFB020"/>
  </g>
</svg>
